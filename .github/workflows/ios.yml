name: iOS build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'ios/**'
      - 'index.html'
      - 'city-bank.js'
      - 'account.*'
      - 'android/src/main/android.css'
      - 'scripts/package-app-assets.cjs'
      - 'scripts/release-version.cjs'
      - 'android/src/main/AndroidManifest.xml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional published version tag to archive, for example v1.4.1'
        type: string

permissions:
  contents: read

jobs:
  simulator:
    if: github.ref_type != 'tag' && (github.event_name != 'workflow_dispatch' || inputs.release_tag == '')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: node scripts/release-version.cjs --check
      - name: Build iPhone and iPad simulator app
        run: |
          xcodebuild -project ios/StudyDesk.xcodeproj -scheme StudyDesk -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/StudyDeskBuild" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check local SQLite and packaged answer keys
        run: |
          mkdir -p "$RUNNER_TEMP/StudyDeskTests"
          xcrun --sdk macosx swiftc ios/StudyDesk/StudyStore.swift ios/Tests/StudyStoreSmoke.swift \
            -o "$RUNNER_TEMP/StudyDeskTests/smoke"
          "$RUNNER_TEMP/StudyDeskTests/smoke" \
            "$RUNNER_TEMP/StudyDeskBuild/Build/Products/Debug-iphonesimulator/StudyDesk.app/WebAssets/question-bank.json"
      - name: Launch on an iPhone simulator
        run: |
          DEVICE="$(xcrun simctl list devices available --json | node -e '
            const devices = Object.values(JSON.parse(require("fs").readFileSync(0, "utf8")).devices).flat();
            const iPhone = devices.find(device => device.name.startsWith("iPhone"));
            if (!iPhone) process.exit(1);
            console.log(iPhone.udid);
          ')"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$RUNNER_TEMP/StudyDeskBuild/Build/Products/Debug-iphonesimulator/StudyDesk.app"
          xcrun simctl launch "$DEVICE" com.fangxue.studydesk

  archive:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Prepare a Release archive for physical iPhone and iPad devices
        run: |
          VERSION="$(node scripts/release-version.cjs --check)"
          if [ -n "$RELEASE_TAG" ]; then test "$RELEASE_TAG" = "v$VERSION"; fi
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [ "${SDK%%.*}" -lt 26 ]; then echo "iOS 26 SDK or newer required; got $SDK"; exit 1; fi
          ARCHIVE="$RUNNER_TEMP/StudyDesk-iOS-v$VERSION.xcarchive"
          xcodebuild -project ios/StudyDesk.xcodeproj -scheme StudyDesk -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" CODE_SIGNING_ALLOWED=NO archive
          APP="$ARCHIVE/Products/Applications/StudyDesk.app"
          /usr/bin/plutil -lint "$APP/PrivacyInfo.xcprivacy"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$APP/Info.plist")" = iphoneos
          node -e 'if (!Object.keys(require(process.argv[1])).length) process.exit(1)' "$APP/WebAssets/question-bank.json"
          ditto -c -k --keepParent "$ARCHIVE" "$RUNNER_TEMP/StudyDesk-iOS-v$VERSION-unsigned-xcarchive.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: ios-release-archive
          path: ${{ runner.temp }}/StudyDesk-iOS-v*-unsigned-xcarchive.zip
          if-no-files-found: error
